<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript 编辑器</title>
  <link rel="stylesheet" href="vendor/codemirror/codemirror.min.css">
  <link rel="stylesheet" href="vendor/codemirror/addon/fold/foldgutter.min.css">
  <link rel="stylesheet" href="vendor/codemirror/addon/hint/show-hint.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="topbar">
    <div class="brand"><span class="brand-dot"></span>JavaScript 编辑器</div>
    <div id="projectName" class="project-name"></div>
    <div id="currentFile" class="current-file">未打开文件</div>
    <div class="spacer"></div>
    <div class="tool-group">
      <button id="undoBtn" class="icon-tool" type="button" title="撤销 (Ctrl+Z)">撤销</button>
      <button id="redoBtn" class="icon-tool" type="button" title="重做 (Ctrl+Shift+Z)">重做</button>
      <button id="hintBtn" class="icon-tool" type="button" title="代码补全 (Ctrl+Space)">补全</button>
      <button id="formatBtn" class="icon-tool" type="button" title="格式化文档 (Shift+Alt+F)">格式化</button>
      <button id="lintBtn" class="icon-tool" type="button" title="检查问题 (Ctrl+Shift+M)">检查</button>
      <button id="breakpointBtn" class="icon-tool" type="button" title="在当前行切换断点 (F9)；也可以点击行号左侧窄栏">断点</button>
      <button id="findBtn" class="icon-tool" type="button" title="查找替换 (Ctrl+F)">查找</button>
      <span class="tool-sep"></span>
      <button id="foldAllBtn" class="icon-tool" type="button" title="折叠全部">折叠</button>
      <button id="unfoldAllBtn" class="icon-tool" type="button" title="展开全部">展开</button>
      <span class="tool-sep"></span>
      <select id="themeSelect" class="theme-select" title="界面风格">
        <option value="javascript">JavaScript</option>
        <option value="lyra">经典蓝</option>
        <option value="violet">深空紫</option>
        <option value="emerald">森林绿</option>
        <option value="sunset">暖阳橙</option>
        <option value="sakura">樱花粉</option>
        <option value="light">极简白</option>
      </select>
    </div>
    <button id="saveBtn" class="tb-btn" type="button" title="Ctrl+S">保存</button>
    <button id="runSelectionBtn" class="tb-btn" type="button" title="只运行选中的 JavaScript">▶ 运行选中</button>
    <button id="runBtn" class="tb-btn primary" type="button" title="Ctrl+Enter">▶ 运行文件</button>
    <span id="runBadge" class="run-badge" hidden>运行中…</span>
  </header>

  <div id="workspace">
    <aside id="sidebar">
      <div class="side-head">
        <span>项目文件</span>
        <button id="refreshBtn" class="icon-btn" type="button" title="刷新">↻</button>
      </div>
      <div id="fileTree" class="file-tree"></div>
      <div class="side-hint">HTML 文件会交给 HTML 编辑器插件打开</div>
    </aside>
    <div id="sidebarResizer" class="pane-resizer vertical" title="拖动调整文件树宽度"></div>

    <main id="main">
      <div id="editorArea">
        <section id="editorColumn">
          <div id="editorHead">
            <span id="languageBadge" class="lang-badge">JavaScript</span>
            <span id="dirtyBadge" class="dirty-badge" hidden>未保存</span>
            <span class="spacer"></span>
            <button id="actionsBtn" class="head-action" type="button" title="代码操作">操作 ▾</button>
            <span id="saveState" class="save-state">就绪</span>
          </div>
          <div id="editorWrap">
            <textarea id="code" spellcheck="false"></textarea>
            <div id="paramHint" class="param-hint" hidden></div>
            <div id="hoverCard" class="hover-card" hidden></div>
            <div id="findBar" class="find-bar" hidden>
              <div class="find-row">
                <input id="findInput" type="text" placeholder="查找…" spellcheck="false" autocomplete="off"/>
                <span id="findCount" class="find-count">0/0</span>
                <button id="findPrev" class="find-btn" type="button" title="上一个 (Shift+Enter)">↑</button>
                <button id="findNext" class="find-btn" type="button" title="下一个 (Enter)">↓</button>
                <label class="case-label" title="区分大小写"><input id="findCase" type="checkbox"/> Aa</label>
                <button id="findClose" class="find-btn close" type="button" title="关闭 (Esc)">×</button>
              </div>
              <div class="find-row replace-row">
                <input id="replaceInput" type="text" placeholder="替换为…" spellcheck="false" autocomplete="off"/>
                <button id="replaceBtn" class="find-btn" type="button">替换</button>
                <button id="replaceAllBtn" class="find-btn" type="button">全部替换</button>
              </div>
            </div>
          </div>
        </section>
        <div id="outlineResizer" class="pane-resizer vertical" title="拖动调整大纲宽度"></div>
        <aside id="outlinePanel">
          <div class="side-tabs">
            <button id="sideOutlineBtn" class="side-tab active" type="button">大纲 <span id="outlineCount">0</span></button>
            <button id="sideRefsBtn" class="side-tab" type="button">引用 <span id="refsCount">0</span></button>
          </div>
          <div id="outlineList" class="outline-list"></div>
          <div id="refsList" class="refs-list" hidden></div>
        </aside>
      </div>
      <div id="bottomResizer" class="pane-resizer horizontal" title="拖动调整控制台高度"></div>

      <section id="bottomPanel">
        <div id="panelTabs">
          <button id="consoleTab" class="panel-tab active" type="button">Console</button>
          <button id="problemsTab" class="panel-tab" type="button">问题 <span id="problemsCount">0</span></button>
          <button id="debugTab" class="panel-tab" type="button">调试</button>
          <span id="runtimeBadge" class="runtime-badge">浏览器沙箱</span>
          <span class="spacer"></span>
          <label class="panel-toggle" title="无 DOM 的代码在 Worker 中执行，可强制终止"><input id="workerSandbox" type="checkbox" checked/> Worker</label>
          <label class="panel-toggle" title="新输出到来时自动滚到底部"><input id="consoleAutoScroll" type="checkbox" checked/> 自动滚动</label>
          <button id="copyConsoleBtn" class="panel-tool" type="button">复制</button>
          <button id="clearConsoleBtn" class="panel-tool" type="button">清空</button>
        </div>
        <div id="consoleOutput" class="console-output">
          <div class="console-empty">点击「运行文件」或「运行选中」执行 JavaScript，console.log 会输出到这里。</div>
        </div>
        <div id="problemsLayout" class="problems-layout" hidden>
          <div id="problemList" class="problem-list"></div>
          <aside id="problemDetail" class="problem-detail">
            <div class="problem-detail-empty">选择一条问题查看详情</div>
          </aside>
        </div>
        <div id="debugLayout" class="debug-layout" hidden>
          <div class="debug-toolbar">
            <button id="debugResume" class="debug-btn primary" type="button" disabled>继续</button>
            <button id="debugPause" class="debug-btn" type="button" disabled>暂停</button>
            <button id="debugStepOver" class="debug-btn" type="button" disabled>单步</button>
            <button id="debugStepInto" class="debug-btn" type="button" disabled>进入</button>
            <button id="debugStepOut" class="debug-btn" type="button" disabled>跳出</button>
            <span id="debugStatus" class="debug-status">选择「调试」标签后运行文件即可断点调试</span>
          </div>
          <div class="debug-body">
            <section class="debug-column"><h4>调用栈</h4><div id="debugCallStack" class="debug-list"></div></section>
            <section class="debug-column"><h4>变量</h4><div id="debugVariables" class="debug-list"></div></section>
            <section class="debug-column"><h4>求值</h4><div class="debug-eval-row"><input id="debugEvalInput" type="text" placeholder="在暂停的栈帧里求值，例如 a + 1" spellcheck="false"/><button id="debugEvalBtn" class="debug-btn" type="button" disabled>求值</button></div><div id="debugEvalResult" class="debug-eval-result"></div></section>
          </div>
        </div>
        <div class="repl-row">
          <span class="repl-prompt">›</span>
          <input id="replInput" type="text" placeholder="输入 JavaScript 表达式，回车执行（例如 1 + 2）" spellcheck="false" autocomplete="off"/>
        </div>
      </section>

      <div id="statusbar">
        <span id="statusPos">Ln 1, Col 1</span>
        <span id="statusFile"></span>
        <span id="statusType"></span>
        <span id="statusSave"></span>
        <span id="statusRun"></span>
      </div>
    </main>
  </div>

  <iframe id="runFrame" sandbox="allow-scripts" hidden></iframe>
  <div id="actionsMenu" class="actions-menu" hidden></div>
  <div id="importPicker" class="import-picker" hidden>
    <div class="import-head"><span>自动导入符号</span><button id="importClose" class="panel-tool" type="button">×</button></div>
    <input id="importSearch" class="import-search" type="text" placeholder="搜索项目导出符号…" spellcheck="false" autocomplete="off"/>
    <div id="importList" class="import-list"></div>
  </div>
  <div id="symbolDialogMask" class="symbol-dialog-mask" hidden>
    <div class="symbol-dialog">
      <h3 id="symbolDialogTitle"></h3>
      <div id="symbolDialogMessage" class="symbol-dialog-message"></div>
      <input id="symbolDialogInput" class="symbol-dialog-input" type="text" spellcheck="false" autocomplete="off"/>
      <div class="symbol-dialog-actions">
        <button id="symbolDialogCancel" class="find-btn" type="button">取消</button>
        <button id="symbolDialogOk" class="find-btn primary" type="button">确定</button>
      </div>
    </div>
  </div>
  <div id="toast" class="toast" hidden></div>

  <script src="vendor/codemirror/codemirror.min.js"></script>
  <script src="vendor/codemirror/mode/javascript/javascript.min.js"></script>
  <script src="vendor/codemirror/mode/xml/xml.min.js"></script>
  <script src="vendor/codemirror/mode/htmlmixed/htmlmixed.min.js"></script>
  <script src="vendor/codemirror/mode/css/css.min.js"></script>
  <script src="vendor/codemirror/addon/edit/closebrackets.min.js"></script>
  <script src="vendor/codemirror/addon/edit/matchbrackets.min.js"></script>
  <script src="vendor/codemirror/addon/selection/active-line.min.js"></script>
  <script src="vendor/codemirror/addon/fold/foldcode.min.js"></script>
  <script src="vendor/codemirror/addon/fold/foldgutter.min.js"></script>
  <script src="vendor/codemirror/addon/fold/brace-fold.min.js"></script>
  <script src="vendor/codemirror/addon/hint/show-hint.min.js"></script>
  <script src="vendor/codemirror/addon/hint/javascript-hint.min.js"></script>
  <script src="vendor/lint/acorn.js"></script>
  <script src="vendor/lint/acorn-loose.js"></script>
  <script src="vendor/lint/acorn-walk.js"></script>
  <script src="vendor/lint/beautify.js"></script>
  <script src="vendor/eslint/linter.min.js"></script>
  <script src="lint.js"></script>
  <script src="vendor/monaco-ts.min.js"></script>
  <script src="language.js"></script>
  <script src="vendor/monaco-completion.js"></script>
  <script src="app.js"></script>
</body>
</html>
